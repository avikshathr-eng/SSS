<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Structure and Sky Studios - Animated Logo</title>
<style>
:root{--bg:#0E1824;--fg:#F2EBDD;--accent:#C8A064;--muted:#8d97a3}
:root[data-theme="light"]{--bg:#F4EEE3;--fg:#0E1824;--accent:#A87C3E;--muted:#6b6f75}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .5s,color .5s}

.fg{fill:var(--fg)}.accent{fill:var(--accent)}.line{fill:none;stroke:var(--fg);stroke-linejoin:miter}
#wm{text-align:center;margin-top:2.2vmin;opacity:0;user-select:none}

#ui{position:fixed;bottom:18px;display:flex;gap:10px}
button{background:none;color:var(--muted);border:1px solid color-mix(in srgb,var(--muted) 50%,transparent);padding:7px 14px;border-radius:99px;font:inherit;font-size:12px;letter-spacing:.08em;cursor:pointer}
button:hover{color:var(--fg);border-color:var(--fg)}

<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const q=(t,a,b)=>clamp((t-a)/(b-a)),ease=x=>1-Math.pow(1-x,3),back=x=>{const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},D=Math.PI/180;
const cx=128,dx=56*Math.cos(30*D),dy=28,T=12,PITCH=19,N=6,Y0=188,CY=170,RX=92,RY=22;
const P=(pts,c=true)=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+(c?'Z':'');
const ytop=Y0-PITCH*(N-1),LIFT=34;
/* tower wire (box outline) */
$('wl').setAttribute('d',P([[cx-dx,ytop],[cx,ytop+dy],[cx,Y0+dy+T],[cx-dx,Y0+T]]));
$('wr').setAttribute('d',P([[cx+dx,ytop],[cx,ytop+dy],[cx,Y0+dy+T],[cx+dx,Y0+T]]));
const floors=[...Array(N)].map(()=>{const e=document.createElementNS(NS,'path');$('fl').appendChild(e);return e});
const lidPts=l=>[[cx-dx,ytop-l],[cx,ytop-l-dy],[cx+dx,ytop-l],[cx,ytop-l+dy]];
/* stroke layers made of round-cap segments so width can vary smoothly */
function layer(n){return[...Array(n)].map(()=>{const f=document.createElementNS(NS,'line'),m=document.createElementNS(NS,'line');return{f,m,side:null}})}
function paint(L,pts,wd,op){ // pts: [{x,y,front}], wd widths
 L.forEach((g,i)=>{const A=pts[i],B=pts[i+1],on=A&&B&&wd[i]>.05;if(!on){g.f.style.display='none';g.m.style.display='none';return}
  const front=(A.front+B.front)>=1,w=wd[i];g.f.style.display='';g.f.setAttribute('x1',A.x);g.f.setAttribute('y1',A.y);g.f.setAttribute('x2',B.x);g.f.setAttribute('y2',B.y);g.f.setAttribute('stroke-width',w);g.f.style.opacity=op;
  const tgt=front?$('front'):$('back');if(g.f.parentNode!==tgt)tgt.insertBefore(g.f,tgt.firstChild);
  if(front&&op>.02){g.m.style.display='';g.m.setAttribute('x1',A.x);g.m.setAttribute('y1',A.y);g.m.setAttribute('x2',B.x);g.m.setAttribute('y2',B.y);g.m.setAttribute('stroke-width',w+6);if(g.m.parentNode!==$('mk'))$('mk').appendChild(g.m)}else g.m.style.display='none'})}
const ARC=layer(90),TRAIL=layer(120);
const ep=ph=>({x:cx+RX*Math.cos(ph),y:CY+RY*Math.sin(ph),front:Math.sin(ph)>=0?1:0}); // ellipse point
const SIG0=-0.052; // dot rest position on the (extended) arc, matches the static logo
const arcPhi=s=>(-25+230*s)*D;
let t0=performance.now(),last=0,frozen=null,speed=1,target=1,phase=0;
const qs=new URLSearchParams(location.search);if(qs.has('t'))frozen=parseFloat(qs.get('t'));
if(qs.has('clean'))$('ui').style.display='none';
if(qs.has('transparent')){document.documentElement.style.background='transparent';document.body.style.background='transparent'}
if(qs.get('theme')==='light')document.documentElement.dataset.theme='light';
function render(t,dt){
 /* 1 wireframe draws, 2 floors build, 3 roof lifts */
 const o=ease(q(t,.1,1)),wf=1-q(t,1.1,1.8),da=o>=1?'none':'1';
 for(const id of['wl','wr','lid']){const e=$(id);e.style.strokeDasharray=da;e.style.strokeDashoffset=1-o}
 $('wl').style.opacity=$('wr').style.opacity=wf;
 floors.forEach((e,i)=>{const k=ease(q(t,.95+.13*i,1.45+.13*i)),y=Y0-PITCH*i,yy=y+T*(1-k);e.setAttribute('d',k<=0?'':P([[cx-dx,yy],[cx,yy+dy],[cx+dx,yy],[cx+dx,y+T],[cx,y+dy+T],[cx-dx,y+T]]))});
 const lk=q(t,1.9,2.7);$('lid').setAttribute('d',P(lidPts(LIFT*Math.max(0,back(lk)))));$('lid').style.strokeWidth=2.5+4.5*ease(lk);
 /* 4 drone spirals up from the base, leaving a comet trail */
 const tu=q(t,2.5,3.9),u=ease(tu),tr=[],tw=[];
 for(let i=0;i<=120;i++){const v=i/120,phi=(-37-360*(1-v))*D,yc=CY+(212-CY)*(1-v);tr.push({x:cx+RX*Math.cos(phi),y:yc+RY*Math.sin(phi),front:Math.sin(phi)>=0?1:0});
  const age=(u-v);tw.push(age<0||tu<=0?0:Math.max(0,1-age/.4)*(2+5*(1+Math.sin(phi))/2)*Math.min(1,v*20))}
 paint(TRAIL,tr,tw,1-q(t,4.1,4.9));
 const hi=Math.round(u*120),dpos=tu>0?tr[hi]:null,dphi=(-37-360*(1-u))*D;
 /* 5 the orbit arc draws in, then the drone patrols it */
 const ar=ease(q(t,4.0,5.0)),ap=[],aw=[];for(let i=0;i<=90;i++){const s=i/90;ap.push(ep(arcPhi(s)));aw.push(s<=ar?(1.2+9*Math.pow(Math.sin(Math.PI*s),1.1))*Math.min(1,(ar-s)*30+.001):0)}
 paint(ARC,ap,aw,1);
 let dp,dop=ease(q(t,2.5,2.8));const rest=ep(arcPhi(SIG0));
 if(tu<1)dp=dpos||rest;
 else if(t<4.9||(frozen!=null&&t>=20))dp=rest;
 else{if(dt!=null){speed+=(target-speed)*Math.min(1,dt*4);phase+=dt*speed}else phase=t-4.9;const c=.5-.5*Math.cos(2*Math.PI*phase/8);dp=ep(arcPhi(SIG0+(1.05-SIG0)*c))}
 for(const[id,show]of[['df',dp.front],['db',!dp.front]]){const e=$(id);e.setAttribute('cx',dp.x);e.setAttribute('cy',dp.y);e.style.opacity=show?dop:0;if(show){const g=$(id).parentNode;g.appendChild(e)}}
 /* 6 wordmark */
 const w=ease(q(t,3.4,4.4));$('wm').style.opacity=w;$('wm').style.transform=`translateY(${(1-w)*8}px)`;
}
function tick(now){const t=frozen!=null?frozen:(now-t0)/1000,dt=Math.min(.05,(now-last)/1000||0);last=now;render(t,frozen!=null?null:dt);if(frozen==null)requestAnimationFrame(tick)}
if(matchMedia('(prefers-reduced-motion: reduce)').matches&&frozen==null)frozen=99;
requestAnimationFrame(tick);
const replay=()=>{if(qs.has('t'))return;const was=frozen==null;frozen=null;t0=performance.now();phase=0;if(!was||true)requestAnimationFrame(tick)};
$('rp').onclick=replay;$('stage').onclick=replay;
$('stage').onmouseenter=()=>target=3;$('stage').onmouseleave=()=>target=1;
$('th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'};
</script></body></html>
